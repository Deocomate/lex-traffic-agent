policy:
  cache_similarity: 0.97
  cache_ttl_days: 30
  max_tool_turns: 4
tools:
- name: penalty_lookup
  description: 'Tra cứu mức phạt tiền (VNĐ), số điểm giấy phép lái xe bị trừ và hình thức xử phạt bổ sung trên toàn
    văn Nghị định 168/2024/NĐ-CP (634 hành vi vi phạm, hiệu lực 01/01/2025). Dùng cho mọi câu hỏi về chế tài: nồng
    độ cồn, vượt đèn đỏ, quá tốc độ, mũ bảo hiểm, điện thoại, chở quá số người, đi ngược chiều, vỉa hè, cao tốc...'
  handler: domains.vietnam_traffic.tools:penalty_lookup
  parameters:
    type: object
    properties:
      violation_keyword:
        type: string
        description: 'Tên hành vi vi phạm hoặc từ khóa kèm loại xe (ví dụ: ''nồng độ cồn ô tô'', ''uống bia lái
          xe máy'', ''vượt đèn đỏ ô tô'', ''chạy quá tốc độ ô tô'', ''không đội mũ bảo hiểm'')'
    required:
    - violation_keyword
  evidence_builder: domains.vietnam_traffic.evidence:penalty_lookup
- name: traffic_sign_lookup
  description: 'Tra cứu biển báo giao thông hoặc vạch kẻ đường theo Quy chuẩn QCVN 41:2019/BGTVT. Cung cấp tên biển,
    nhóm biển (cấm, hiệu lệnh, nguy hiểm, chỉ dẫn, phụ, vạch kẻ đường), ý nghĩa sử dụng và HÌNH ẢNH MINH HỌA MARKDOWN
    để người dùng xem trực quan. Dùng khi hỏi: ''biển P.106a'', ''biển cấm xe tải'', ''biển W.201'', ''vạch 1.1'',
    ''biển này có ý nghĩa gì''...'
  handler: domains.vietnam_traffic.tools:traffic_sign_lookup
  parameters:
    type: object
    properties:
      sign_code_or_name:
        type: string
        description: Mã biển báo (P.106a, W.201, R.403a, Vạch 1.1...) hoặc tên biển ('cấm rẽ trái', 'cấm xe tải',
          'hết hạn chế tốc độ')
    required:
    - sign_code_or_name
  evidence_builder: domains.vietnam_traffic.evidence:traffic_sign_lookup
- name: speed_limit_lookup
  description: 'Tra cứu quy định về tốc độ tối đa cho phép (km/h) và khoảng cách an toàn (mét) của xe ô tô, xe máy,
    xe tải theo Thông tư 31/2019/TT-BGTVT. Phân biệt rõ: trong khu vực đông dân cư vs ngoài khu vực đông dân cư,
    đường đôi vs đường hai chiều, đường cao tốc.'
  handler: domains.vietnam_traffic.tools:speed_limit_lookup
  parameters:
    type: object
    properties:
      query:
        type: string
        description: 'Nội dung câu hỏi về tốc độ hoặc khoảng cách an toàn (ví dụ: ''tốc độ xe máy trong khu đông
          dân cư'', ''khoảng cách an toàn chạy 80km/h'', ''tốc độ xe ô tô ngoài đô thị'')'
    required:
    - query
  evidence_builder: domains.vietnam_traffic.evidence:speed_limit_lookup
- name: keyword_search
  description: Tìm kiếm chính xác các Điều luật trong Luật Giao thông 2024 chứa từ khóa, tên hạng bằng lái xe (A1,
    C1, B, C, D), số tuổi (16 tuổi, 18 tuổi), con số (50cc, 12 điểm), hoặc thuật ngữ pháp lý.
  handler: domains.vietnam_traffic.tools:keyword_search
  parameters:
    type: object
    properties:
      keywords:
        type: string
        description: 'Từ khóa hoặc cụm từ cần tìm (ví dụ: ''hạng C1'', ''nồng độ cồn'', ''xe 50cc'', ''12 điểm bằng
          lái'', ''trẻ em ngồi ghế trước'')'
    required:
    - keywords
  evidence_builder: domains.vietnam_traffic.evidence:keyword_search
- name: semantic_search
  description: 'Tìm kiếm ngữ nghĩa sâu (Dense Vector Search 3072 chiều) trên toàn bộ 6 văn bản: Luật 36/2024 (quy
    tắc, GPLX), Luật 35/2024 (đường bộ, cao tốc, vận tải), Thông tư 31/2019 (tốc độ), Thông tư 73/2024 (tuần tra
    CSGT, quyền dừng xe, giấy tờ VNeID), QCVN 41:2019 (báo hiệu, biển báo). Dùng khi câu hỏi mô tả tình huống đời
    thường hoặc hỏi về quyền hạn CSGT.'
  handler: domains.vietnam_traffic.tools:semantic_search
  parameters:
    type: object
    properties:
      question:
        type: string
        description: 'Mô tả tình huống hoặc câu hỏi đầy đủ bằng tiếng Việt (ví dụ: ''CSGT được dừng xe trong những
          trường hợp nào'', ''kiểm tra giấy tờ qua VNeID có được không'', ''chở con nhỏ ngồi trước xe máy'')'
      doc_scope:
        type: string
        enum:
        - all
        - luat
        - nghi_dinh
        - thong_tu
        - quy_chuan
        description: Phạm vi văn bản cần tìm (mặc định 'all' để tìm trong toàn bộ kho luật)
    required:
    - question
  evidence_builder: domains.vietnam_traffic.evidence:semantic_search
- name: get_article
  description: Lấy toàn văn một Điều luật cụ thể theo số hiệu Điều và mã văn bản.
  handler: domains.vietnam_traffic.tools:get_article
  parameters:
    type: object
    properties:
      article_number:
        type: integer
        description: 'Số hiệu của Điều luật cần tra cứu (ví dụ: 9, 10, 31, 56, 57, 58, 89)'
      doc_id:
        type: string
        description: Mã văn bản (mặc định '01_luat_36_2024_qh15', hoặc '02_luat_35_2024_qh15', '04_thong_tu_31_2019_tt_bgtvt',
          '05_thong_tu_73_2024_tt_bca')
    required:
    - article_number
  evidence_builder: domains.vietnam_traffic.evidence:get_article
- name: list_chapters
  description: Xem danh mục 9 Chương của Luật 36/2024/QH15 để định hướng khu vực cần tra cứu.
  handler: domains.vietnam_traffic.tools:list_chapters
  parameters:
    type: object
    properties: {}
presentation:
  describe_call: domains.vietnam_traffic.presentation:describe_call
  summarize_result: domains.vietnam_traffic.presentation:summarize_result
