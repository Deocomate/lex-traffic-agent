<header class="topbar">
  <div class="topbar-left">
    <button class="btn btn--ghost btn--icon" id="btn-toggle-sidebar" type="button" aria-label="Ẩn hoặc hiện thanh bên" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <line x1="4" x2="20" y1="12" y2="12"/>
        <line x1="4" x2="20" y1="6" y2="6"/>
        <line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    </button>
    <div class="topbar-title">
      <h1 id="view-title">Hỏi đáp AI</h1>
      <span class="topbar-sub" id="view-sub">Trợ lý tra cứu phối hợp 6 văn bản Luật 2024 &amp; Nghị định xử phạt</span>
    </div>
  </div>

  <div class="topbar-actions">
    <button class="palette-trigger-btn" id="btn-open-palette" type="button" aria-label="Mở hộp lệnh tra cứu nhanh (Ctrl+K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <span>Tìm kiếm…</span>
      <kbd class="palette-kbd">Ctrl K</kbd>
    </button>
  </div>
</header>
