<!-- Modal Tra cứu Chi tiết Biển Báo & Vạch Kẻ (WAI-ARIA Dialog) -->
<div class="modal" id="detail-modal" aria-hidden="true" role="presentation">
  <div class="modal__backdrop"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__head">
      <div class="modal__title-group">
        <span class="badge badge--neutral modal-badge" id="modal-badge">QCVN 41:2019</span>
        <h3 class="modal__title" id="modal-title">Chi tiết báo hiệu đường bộ</h3>
      </div>
      <button class="btn btn--ghost btn--icon modal-close" id="btn-modal-close" type="button" aria-label="Đóng hộp thoại">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal__body" id="modal-body">
      <!-- Nội dung chi tiết được inject động từ JS -->
    </div>
    <div class="modal__foot">
      <button class="btn btn--secondary" id="btn-modal-copy" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
        Sao chép thông tin
      </button>
      <button class="btn btn--primary" id="btn-modal-done" type="button">Đóng</button>
    </div>
  </div>
</div>

<!-- Toast thông báo nhanh (Stack container) -->
<div class="toast-stack toast-container" id="toast-container" aria-live="polite"></div>
